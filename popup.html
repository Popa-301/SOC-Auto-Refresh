<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SOC Monitor</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <div class="soc-container">

    <!-- ======================================
         HEADER
         ====================================== -->

    <header class="soc-header">

      <div class="brand">

        <img
          src="icons/icon32.png"
          alt="SOC Monitor"
          class="soc-logo"
        >

        <div>
          <h1 class="soc-title">
            SOC MONITOR
          </h1>

          <p class="soc-subtitle">
            Refresh & Keyword Monitor
          </p>
        </div>

      </div>


      <div
        id="statusBadge"
        class="status-indicator status-idle"
      >

        <span class="pulse-dot"></span>

        <span id="statusText">
          IDLE
        </span>

      </div>

    </header>


    <!-- ======================================
         REFRESH ENGINE
         ====================================== -->

    <section class="panel">

      <div class="panel-header">
        REFRESH ENGINE
      </div>


      <!-- Refresh Interval -->

      <div class="form-row">

        <label for="inputInterval">
          Interval
        </label>

        <div class="input-unit">

          <input
            type="number"
            id="inputInterval"
            min="5"
            value="30"
            class="soc-input"
          >

          <span class="unit-label">
            sec
          </span>

        </div>

      </div>


      <!-- Mode -->

      <div class="form-row">

        <label for="selectRunMode">
          Mode
        </label>

        <select
          id="selectRunMode"
          class="soc-select"
        >

          <option value="infinite">
            Infinite Loop
          </option>

          <option value="finite">
            Finite Limit
          </option>

        </select>

      </div>


      <!-- Finite Count -->

      <div
        class="form-row"
        id="rowFiniteCount"
        style="display: none;"
      >

        <label for="inputFiniteCount">
          Max Refreshes
        </label>

        <input
          type="number"
          id="inputFiniteCount"
          min="1"
          value="10"
          class="soc-input"
        >

      </div>

    </section>


    <!-- ======================================
         KEYWORD MONITOR
         ====================================== -->

    <section class="panel">

      <div class="panel-header">
        KEYWORD DETECTION
      </div>


      <!-- Target Keyword -->

      <div class="field-block">

        <label for="inputKeyword">
          Target String
        </label>

        <input
          type="text"
          id="inputKeyword"
          placeholder="e.g. ago, CRITICAL, error"
          maxlength="200"
          autocomplete="off"
          spellcheck="false"
          class="soc-input soc-input-full"
        >

      </div>


      <!-- Custom Alert -->

      <div class="field-block">

        <label for="inputCustomMessage">
          Notification Message
        </label>

        <input
          type="text"
          id="inputCustomMessage"
          placeholder="e.g. New SOC alert detected"
          maxlength="160"
          autocomplete="off"
          class="soc-input soc-input-full"
        >

      </div>


      <!-- Checkboxes -->

      <div class="toggle-grid">

        <label class="checkbox-label">

          <input
            type="checkbox"
            id="chkEnableKeyword"
            checked
          >

          <span>
            Enable Monitor
          </span>

        </label>


        <label class="checkbox-label">

          <input
            type="checkbox"
            id="chkNotifyUser"
            checked
          >

          <span>
            Desktop Alert
          </span>

        </label>

      </div>


      <div class="toggle-grid">

        <label class="checkbox-label">

          <input
            type="checkbox"
            id="chkCaseSensitive"
          >

          <span>
            Case Sensitive
          </span>

        </label>


        <label class="checkbox-label">

          <input
            type="checkbox"
            id="chkDomScope"
          >

          <span>
            Search Raw DOM
          </span>

        </label>

      </div>

    </section>


    <!-- ======================================
         ACTION BUTTONS
         ====================================== -->

    <div class="action-grid">

      <button
        type="button"
        id="btnStart"
        class="btn btn-primary"
      >
        START SESSION
      </button>


      <button
        type="button"
        id="btnStop"
        class="btn btn-danger"
        disabled
      >
        HALT
      </button>

    </div>


    <!-- ======================================
         STATUS / ERROR MESSAGE
         ====================================== -->

    <div
      id="errorNotice"
      class="error-banner"
      role="alert"
      aria-live="polite"
      style="display: none;"
    ></div>

  </div>


  <script src="popup.js"></script>

</body>

</html>
